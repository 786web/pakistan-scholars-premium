<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092c24"><title>Choose New Password | Pakistan Scholars</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f4f5ef;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;width:min(100%,460px);padding:28px;border:1px solid #e1e5dc}.field label{display:block;font-weight:700;margin:16px 0 6px}.field input{width:100%;padding:13px;border:1px solid #dce2da}.btn{background:#0c352a;color:white;border:0;padding:12px 18px;cursor:pointer}.status{font-size:14px;line-height:1.5;min-height:24px}form[hidden]{display:none}
</style></head><body><main class="card"><p><a href="admin.html">← Admin sign in</a></p><h1>Choose a new password</h1><p>Use this page after opening the latest password-reset email.</p><form id="passwordForm" hidden><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><p><button class="btn" type="submit">Save new password</button></p></form><p class="status" id="status" role="status">Checking your secure reset link…</p></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const db=createClient("https://vuptztqeqblngbpflqzt.supabase.co","sb_publishable_fglLwYtA9GpLJdkwRc90Jw_dNw7TtK8");
const form=document.getElementById("passwordForm"),status=document.getElementById("status");
let recoveryReady=false;
db.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session){recoveryReady=true;form.hidden=false;status.textContent="Reset link verified. Enter your new password below."; }});
const{data:{session},error}=await db.auth.getSession();
if(error)status.textContent="Could not verify reset session: "+error.message;
else if(session&&!recoveryReady){form.hidden=false;status.textContent="Secure session found. You can choose a new password.";}
else if(!recoveryReady)status.textContent="No active reset session found. Please request a fresh reset email and open its newest link on this device.";
form.addEventListener("submit",async e=>{e.preventDefault();const p=document.getElementById("newPassword").value,c=document.getElementById("confirmPassword").value;if(p.length<8){status.textContent="Password must be at least 8 characters.";return;}if(p!==c){status.textContent="Passwords do not match.";return;}status.textContent="Saving new password…";const{error}=await db.auth.updateUser({password:p});if(error){status.textContent="Could not update password: "+error.message;return;}status.textContent="Password updated successfully. You can now sign in to the admin dashboard.";form.hidden=true;await db.auth.signOut();});
</script></body></html>
